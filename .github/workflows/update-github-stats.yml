name: Update GitHub contribution data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch GitHub contribution calendar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-github-stats.mjs

      - name: Commit updated contribution data
        run: |
          if git diff --quiet -- public/github-stats.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/github-stats.json
          git commit -m 'chore: update github activity'
          git push
